name: CI/CD React App

# 1. Când vrem să se ruleze acest script?
on:
  push:
    branches:
      - master # (sau master, dacă așa se numește branch-ul tău principal)

# 2. Ce sarcini (jobs) trebuie să execute serverul GitHub?
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub ne dă un server gratuit cu Linux

    steps:
      # Pasul A: GitHub descarcă codul tău pe server
      - name: 📥 Descarcă codul (Checkout)
        uses: actions/checkout@v4

      # Pasul B: Instalăm Node.js pe server
      - name: ⚙️ Setează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pasul C: Instalăm pachetele din package.json
      - name: 📦 Instalează dependențele
        run: npm install

      # Pasul D: Facem build-ul (CI - Integrarea continuă)
      - name: 🔨 Construiește aplicația (Build)
        run: npm run build

      # Pasul E: Luăm fișierele finale și le publicăm (CD - Livrarea continuă)
      - name: 🚀 Publică pe GitHub Pages (Deploy)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # IMPORTANT: Lasă ./dist dacă folosești Vite. Dacă ai folosit Create React App, schimbă în ./build
